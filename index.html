<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="一个轻量、可触屏游玩的网页推箱子小游戏。">
  <title>方块仓库 · 推箱子</title><link rel="stylesheet" href="style.css">
</head>
<body><main class="game-shell">
  <header><p class="eyebrow">MINI SOKOBAN</p><h1>方块仓库</h1><p class="subtitle">把所有木箱推到闪光的目标点</p></header>
  <section class="status" aria-label="游戏状态"><div><span>关卡</span><strong id="level">1 / 3</strong></div><div><span>步数</span><strong id="moves">0</strong></div><div><span>箱子</span><strong id="boxes">0 / 0</strong></div></section>
  <section class="board-wrap"><div id="board" class="board" role="grid" aria-label="推箱子棋盘"></div><div id="win-panel" class="win-panel" hidden><p id="win-title">完成！</p><button id="next" type="button">下一关</button></div></section>
  <div class="actions"><button id="restart" type="button">↻ 重新开始</button><button id="undo" type="button">↶ 撤销一步</button></div>
  <section class="controls" aria-label="方向控制"><button data-direction="up" aria-label="向上">▲</button><button data-direction="left" aria-label="向左">◀</button><button data-direction="down" aria-label="向下">▼</button><button data-direction="right" aria-label="向右">▶</button></section>
  <p class="hint">使用方向键 / WASD，也可以点击或滑动棋盘</p>
</main><script src="game.js"></script></body></html>
